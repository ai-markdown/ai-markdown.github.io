name: Organization website

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: organization-pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          source_sha=$(gh api repos/ai-markdown/ai-markdown/commits/main --jq .sha)
          published_sha=$(curl --fail --silent https://ai-markdown.github.io/source-commit.txt || true)
          if [ "$EVENT_NAME" != schedule ] || [ "$source_sha" != "$published_sha" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    uses: ai-markdown/ai-markdown/.github/workflows/pages.yml@main
